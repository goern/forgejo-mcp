apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: forgejo-mcp-on-pull-request
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" &&
      files.all.exists(f, !(f.startsWith('docs/') || f.endsWith('.md')))
    pipelinesascode.tekton.dev/task: "[git-clone, .tekton/tasks/go-ci.yaml, .tekton/tasks/commit-title-check.yaml]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    # Deliberately NOT the body.pull_request.title dynamic variable (braces
    # omitted here so this comment is not itself a substitution site) — PaC
    # substitutes payload values into the JSON manifest, so a title with a
    # double quote breaks
    # PipelineRun unmarshalling before any TaskRun exists (forgejo-mcp-33l). The
    # documented "|-" block scalar does not protect against it: the substitution
    # is not into YAML source. Pass the PR number, which is numeric and cannot
    # carry a payload, and let the task fetch the title from the API at runtime.
    - name: pr_number
      value: "{{ pull_request_number }}"
    - name: base_ref
      value: "{{ target_branch }}"
  pipelineSpec:
    params:
      - name: repo_url
      - name: revision
      - name: pr_number
      - name: base_ref
    workspaces:
      - name: source
    tasks:
      - name: fetch-source
        taskRef:
          name: git-clone
        workspaces:
          - name: output
            workspace: source
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)

      - name: build-and-test
        taskRef:
          name: go-ci
        runAfter:
          - fetch-source
        workspaces:
          - name: source
            workspace: source

      - name: commit-title-check
        taskRef:
          name: commit-title-check
        runAfter:
          - fetch-source
        params:
          - name: PR_NUMBER
            value: $(params.pr_number)
          - name: REPO_URL
            value: $(params.repo_url)
          - name: BASE_REF
            value: $(params.base_ref)
        workspaces:
          - name: source
            workspace: source

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
