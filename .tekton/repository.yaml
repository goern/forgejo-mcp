apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: forgejo-b4mad-agentic-forges-forgejo-mcp
  namespace: op1st-pipelines
spec:
  url: https://forgejo.b4mad.net/agentic-forges/forgejo-mcp
  git_provider:
    type: forgejo
    url: https://forgejo.b4mad.net
    # Per-instance PaC credentials for forgejo.b4mad.net, mirroring the working
    # feeldata-dev/forgejo-feeldata-app Repository. The token must carry
    # read:repository + write:repository scope on agentic-forges/forgejo-mcp
    # so PaC can report commit status back.
    secret:
      name: forgejo-b4mad
      key: provider.token
    webhook_secret:
      name: forgejo-b4mad
      key: webhook.secret
